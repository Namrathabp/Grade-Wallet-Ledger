services:
  postgres:
    image: postgres:15-alpine
    container_name: wallet_db
    command: postgres -c max_connections=300
    environment:
      POSTGRES_USER: wallet_user
      POSTGRES_PASSWORD: wallet_pass
      POSTGRES_DB: wallet_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wallet_user -d wallet_db"]
      interval: 3s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wallet_api
    command: >
      sh -c "python scripts/run_migrations.py &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"
    environment:
      - DATABASE_URL=postgresql://wallet_user:wallet_pass@postgres:5432/wallet_db
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - .:/app
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wallet_worker
    command: python scripts/run_worker.py
    environment:
      - DATABASE_URL=postgresql://wallet_user:wallet_pass@postgres:5432/wallet_db
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_started
    volumes:
      - .:/app
    restart: unless-stopped

volumes:
  postgres_data: